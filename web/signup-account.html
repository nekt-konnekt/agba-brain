<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create your Agba account</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/onboarding-styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="onboarding-page"><div class="onboarding-shell"><a class="brand onboarding-brand" href="/"><div class="brand-mark">🧠</div><div><strong>Agba</strong><span>Operating brain</span></div></a><div class="onboarding-progress"><i class="active"></i><i class="active"></i><i></i><i></i></div><section class="onboarding-card"><div class="eyebrow">1 OF 3 · ACCOUNT</div><h1>Let's get you set up.</h1><p class="lead">Create your Agba account. We'll use it to keep your company workspace secure.</p><form id="form"><label>Email<input id="email" type="email" autocomplete="email" required placeholder="you@company.com"></label><label>Password<input id="password" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters"></label><button class="primary onboarding-main-btn">Continue</button></form><p class="small-note">Already have an account? <a href="/signin">Sign in</a></p><div id="error" class="form-error"></div></section></div></main><script>const sb=window.supabase.createClient('https://iijhsdaqaqywzpavdonn.supabase.co','sb_publishable_wqJVbxGLbvWgrrXmhsLjKg_ks8Sy9aS');const form=document.getElementById('form'),error=document.getElementById('error');form.onsubmit=async e=>{e.preventDefault();error.textContent='';const em=document.getElementById('email').value.trim(),pw=document.getElementById('password').value;const{data,error:err}=await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:'https://agba.work/onboarding',data:{onboarding:true}}});if(err){error.textContent=err.message;return}if(data.session)location.href='/onboarding';else error.textContent='Check your email. Your confirmation link will bring you back to Agba onboarding.'};</script></body></html>
