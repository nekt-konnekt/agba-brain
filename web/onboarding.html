<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set up your Agba workspace</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/onboarding-styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="onboarding-page"><div class="onboarding-shell"><a class="brand onboarding-brand" href="/"><div class="brand-mark">🧠</div><div><strong>Agba</strong><span>Operating brain</span></div></a><div class="onboarding-progress"><i class="active"></i><i class="active"></i><i class="active"></i><i></i></div><section class="onboarding-card"><div id="stepProfile"><div class="eyebrow">2 OF 3 · YOU + COMPANY</div><h1>Tell Agba who it's working with.</h1><p class="lead">Just the essentials. You can add more later.</p><label>Your name<input id="name" required placeholder="Your full name"></label><label>Company name<input id="company" required placeholder="Your company"></label><label>What does the business do?<input id="description" placeholder="e.g. Printing, packaging and custom apparel"></label><label>Team size<select id="size"><option value="1-10">1-10</option><option value="11-50">11-50</option><option value="51-200">51-200</option><option value="200+">200+</option></select></label><button id="continue" class="primary onboarding-main-btn">Continue</button></div><div id="stepWatch" hidden><div class="eyebrow">3 OF 3 · WHAT AGBA SHOULD WATCH</div><h1>What matters most?</h1><p class="lead">Pick the areas you want Agba watching first.</p><div class="checks"><label><input type="checkbox" value="Sales" checked> Sales</label><label><input type="checkbox" value="Cash flow" checked> Cash flow</label><label><input type="checkbox" value="Operations" checked> Operations</label><label><input type="checkbox" value="Customers"> Customers</label><label><input type="checkbox" value="Suppliers"> Suppliers</label><label><input type="checkbox" value="Orders"> Orders</label><label><input type="checkbox" value="Team"> Team</label><label><input type="checkbox" value="Expenses"> Expenses</label></div><button id="finish" class="primary onboarding-main-btn">Create my Agba workspace</button><p class="small-note">You can change these preferences later.</p></div><div id="error" class="form-error"></div></section></div></main><script>const sb=window.supabase.createClient('https://iijhsdaqaqywzpavdonn.supabase.co','sb_publishable_wqJVbxGLbvWgrrXmhsLjKg_ks8Sy9aS');let session=null,setup={};const error=document.getElementById('error');async function init(){const r=await sb.auth.getSession();session=r.data.session;if(!session)location.href='/signup/account'}init();document.getElementById('continue').onclick=()=>{const n=document.getElementById('name').value.trim(),c=document.getElementById('company').value.trim();if(!n||!c){error.textContent='Name and company are required.';return}setup={name:n,company:c,description:document.getElementById('description').value.trim(),size:document.getElementById('size').value};document.getElementById('stepProfile').hidden=true;document.getElementById('stepWatch').hidden=false};document.getElementById('finish').onclick=async()=>{error.textContent='';const btn=document.getElementById('finish');btn.disabled=true;btn.textContent='Setting up Agba...';const areas=[...document.querySelectorAll('.checks input:checked')].map(x=>x.value);const slug=setup.company.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,80);const departments=(areas.length?areas:['Operations']).map(x=>({name:x,slug:x.toLowerCase().replace(/[^a-z0-9]+/g,'-'),description:`Agba monitoring area: ${x}`,head:{full_name:setup.name,email:session.user.email}}));const{data,error:err}=await sb.functions.invoke('company-setup',{body:{company:{name:setup.company,slug,timezone:'Africa/Lagos',currency_code:'NGN'},ceo:{full_name:setup.name},departments}});if(err||data?.error){error.textContent=data?.error||err?.message||'Could not complete setup.';btn.disabled=false;btn.textContent='Create my Agba workspace';return}await sb.auth.updateUser({data:{onboarding_completed:true,company_name:setup.company,company_description:setup.description,team_size:setup.size,watch_areas:areas}});location.href='/onboarding/telegram'};</script></body></html>
