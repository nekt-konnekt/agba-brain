<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in to Agba</title><meta name="description" content="Sign in to Agba Office and see what changed, what is at risk, and what deserves your attention."><link rel="icon" href="/agba-logo.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/agba-logo.svg"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/onboarding-styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="onboarding-page"><div class="onboarding-shell"><a class="brand onboarding-brand" href="/"><img src="/agba-logo.svg" alt="Agba" width="42" height="42"><div><strong>agba</strong><span>Executive operating layer</span></div></a><section class="onboarding-card"><div class="eyebrow">WELCOME BACK</div><h1>Know what matters today.</h1><p class="lead">Sign in to Agba Office and see what changed, what is at risk, and what deserves your attention.</p><form id="form"><label>Email<input id="email" type="email" required autocomplete="email" placeholder="you@company.com"></label><label>Password<div class="password-wrap"><input id="password" type="password" required autocomplete="current-password" placeholder="Your password"><button type="button" id="toggle" class="password-toggle" aria-label="Show password"></button></div></label><p class="small-note" style="text-align:right;margin-top:-10px"><a href="/forgot-password">Forgot password?</a></p><button class="primary onboarding-main-btn">Open Agba Office</button></form><p class="small-note">New to Agba? <a href="/signup">Start with Agba</a></p><div id="error" class="form-error" role="alert" aria-live="polite"></div></section></div></main><script>const sb=window.supabase.createClient('https://iijhsdaqaqywzpavdonn.supabase.co','sb_publishable_wqJVbxGLbvWgrrXmhsLjKg_ks8Sy9aS');const form=document.getElementById('form'),email=document.getElementById('email'),password=document.getElementById('password'),error=document.getElementById('error'),toggle=document.getElementById('toggle');toggle.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.1 12s3.5-6 9.9-6 9.9 6 9.9 6-3.5 6-9.9 6-9.9-6-9.9-6Z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="2.7" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>';toggle.onclick=()=>{const show=password.type==='password';password.type=show?'text':'password';toggle.setAttribute('aria-label',show?'Hide password':'Show password')};form.onsubmit=async e=>{e.preventDefault();error.textContent='';const{data,error:err}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(err){error.textContent=err.message;return}const{data:u,error:profileErr}=await sb.from('agba_users').select('id').eq('auth_user_id',data.user.id).maybeSingle();if(profileErr){error.textContent='Signed in, but Agba could not load your workspace. Please try again.';return}location.href=u?.id?'/office':'/onboarding'};</script></body></html>
