<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset your Agba password</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/onboarding-styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main class="onboarding-page">
    <div class="onboarding-shell">
      <a class="brand onboarding-brand" href="/"><div class="brand-mark">🧠</div><div><strong>Agba</strong><span>Operating brain</span></div></a>
      <section class="onboarding-card">
        <div class="eyebrow">PASSWORD RECOVERY</div>
        <h1>Reset your password.</h1>
        <p class="lead">Enter your email and we'll send you a secure password reset link.</p>
        <form id="form">
          <label for="email">Email<input id="email" type="email" required autocomplete="email" placeholder="you@company.com"></label>
          <button id="submitBtn" class="primary onboarding-main-btn" type="submit">Send reset link</button>
        </form>
        <p class="small-note"><a href="/signin">Back to sign in</a></p>
        <div id="error" class="form-error" role="alert" aria-live="polite"></div>
        <div id="success" class="form-success" role="status" aria-live="polite"></div>
      </section>
    </div>
  </main>
  <script>
    const sb = window.supabase.createClient('https://iijhsdaqaqywzpavdonn.supabase.co','sb_publishable_wqJVbxGLbvWgrrXmhsLjKg_ks8Sy9aS');
    const form=document.getElementById('form'),email=document.getElementById('email'),btn=document.getElementById('submitBtn'),error=document.getElementById('error'),success=document.getElementById('success');
    form.onsubmit=async e=>{e.preventDefault();error.textContent='';success.textContent='';btn.disabled=true;btn.textContent='Sending…';const{error:err}=await sb.auth.resetPasswordForEmail(email.value.trim(),{redirectTo:'https://agba.work/reset-password'});if(err){error.textContent=err.message;btn.disabled=false;btn.textContent='Send reset link';return}success.textContent='If an account exists for that email, a password reset link has been sent. Check your inbox.';btn.textContent='Reset link sent';};
  </script>
</body>
</html>
