<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Choose a new Agba password</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/onboarding-styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main class="onboarding-page">
    <div class="onboarding-shell">
      <a class="brand onboarding-brand" href="/"><div class="brand-mark">🧠</div><div><strong>Agba</strong><span>Operating brain</span></div></a>
      <section class="onboarding-card">
        <div class="eyebrow">PASSWORD RECOVERY</div>
        <h1>Choose a new password.</h1>
        <p class="lead">Set a new password for your Agba account.</p>
        <form id="form">
          <label for="password">New password<div class="password-wrap"><input id="password" type="password" minlength="8" required autocomplete="new-password" placeholder="At least 8 characters"><button type="button" id="toggle" class="password-toggle" aria-label="Show password"></button></div></label>
          <label for="confirm">Confirm password<input id="confirm" type="password" minlength="8" required autocomplete="new-password" placeholder="Enter it again"></label>
          <button id="submitBtn" class="primary onboarding-main-btn" type="submit">Update password</button>
        </form>
        <p class="small-note"><a href="/signin">Back to sign in</a></p>
        <div id="error" class="form-error" role="alert" aria-live="polite"></div>
        <div id="success" class="form-success" role="status" aria-live="polite"></div>
      </section>
    </div>
  </main>
  <script>
    const sb=window.supabase.createClient('https://iijhsdaqaqywzpavdonn.supabase.co','sb_publishable_wqJVbxGLbvWgrrXmhsLjKg_ks8Sy9aS');
    const form=document.getElementById('form'),password=document.getElementById('password'),confirm=document.getElementById('confirm'),btn=document.getElementById('submitBtn'),error=document.getElementById('error'),success=document.getElementById('success'),toggle=document.getElementById('toggle');
    toggle.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.1 12s3.5-6 9.9-6 9.9 6 9.9 6-3.5 6-9.9 6-9.9-6-9.9-6Z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="2.7" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>';
    toggle.onclick=()=>{const show=password.type==='password';password.type=show?'text':'password';confirm.type=show?'text':'password';toggle.setAttribute('aria-label',show?'Hide password':'Show password');};
    form.onsubmit=async e=>{e.preventDefault();error.textContent='';success.textContent='';if(password.value.length<8){error.textContent='Your password must be at least 8 characters.';return}if(password.value!==confirm.value){error.textContent='The passwords do not match.';return}btn.disabled=true;btn.textContent='Updating…';const{error:err}=await sb.auth.updateUser({password:password.value});if(err){error.textContent=err.message;btn.disabled=false;btn.textContent='Update password';return}success.textContent='Password updated successfully. Redirecting to sign in…';setTimeout(()=>location.href='/signin',1200);};
  </script>
</body>
</html>
