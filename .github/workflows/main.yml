name: Agba E2E Test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    environment: Agba
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run reliability state machine contracts
        run: deno run tests/reliability-state-machine.ts
      - name: Run Telegram queue reliability E2E
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: deno run --allow-net --allow-env tests/telegram-queue-reliability-e2e.ts
      - name: Run Puter provider fallback test
        run: deno run --allow-env --allow-net tests/puter-provider-fallback.ts
      - name: Run Agba Alibaba E2E
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_BASE_URL: ${{ secrets.DASHSCOPE_BASE_URL }}
          DASHSCOPE_MODEL: ${{ secrets.DASHSCOPE_MODEL }}
        run: |
          deno run --allow-net --allow-env tests/agba-puter-e2e.ts
          deno run --allow-net --allow-env tests/agba-memory-e2e.ts
          deno run --allow-net --allow-env tests/agba-ceo-query-e2e.ts
          deno run --allow-net --allow-env tests/agba-action-memory-e2e.ts
      - name: Run Agba action execution E2E
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: deno run --allow-net tests/agba-action-execution-e2e.ts
