name: Agba E2E Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'actions/**'
      - 'ask/**'
      - 'decisions/**'
      - 'departments/**'
      - 'office/**'
      - 'supabase/**'
      - 'tests/**'
      - 'server.js'
      - 'package.json'
      - '.github/workflows/main.yml'
  pull_request:
    branches: [main]
    paths:
      - 'actions/**'
      - 'ask/**'
      - 'decisions/**'
      - 'departments/**'
      - 'office/**'
      - 'supabase/**'
      - 'tests/**'
      - 'server.js'
      - 'package.json'
      - '.github/workflows/main.yml'

concurrency:
  group: agba-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    environment: Agba
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run reliability state machine contracts
        run: deno run tests/reliability-state-machine.ts
      - name: Run Telegram queue reliability E2E
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: deno run --allow-net --allow-env tests/telegram-queue-reliability-e2e.ts
      - name: Run Workforce Action lifecycle E2E
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: deno run --allow-net --allow-env tests/workforce-action-router-e2e.ts
      - name: Run Puter provider fallback test
        run: deno run --allow-env --allow-net tests/puter-provider-fallback.ts
      - name: Run Agba action execution E2E
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: deno run --allow-net --allow-env tests/agba-action-execution-e2e.ts
      - name: Run governed proposal execution E2E
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: deno run --allow-net --allow-env tests/agba-proposal-execution-e2e.ts
      - name: Run governed Telegram connector execution E2E
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: deno run --allow-net --allow-env tests/agba-telegram-connector-execution-e2e.ts
      - name: Run longitudinal intelligence E2E
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: deno run --allow-net --allow-env tests/longitudinal-intelligence-e2e.ts
