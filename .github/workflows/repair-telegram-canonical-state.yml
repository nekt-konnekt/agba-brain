name: repair telegram canonical state

on:
  push:
    branches:
      - fix/telegram-executive-director-contract

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/telegram-executive-director-contract
      - name: Wire canonical executive state into briefing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/telegram-gateway/index.ts')
          s = p.read_text()
          if 'getCanonicalExecutiveState' not in s:
              needle = 'async function stateBestEffort(sb:any,org:string,dept:string|null){try{return await state(sb,org,dept)}catch(error){console.error("telegram_state_failed",error);return{executive_state:{}}}}'
              alias = needle + '\nasync function getCanonicalExecutiveState(sb:any,org:string,dept:string|null,limit=40){return await state(sb,org,dept)}'
              if needle not in s: raise SystemExit('stateBestEffort needle not found')
              s = s.replace(needle, alias, 1)
          old = 'const c=await state(sb,binding.organization_id,role==="department_head"?dept:null),e=c.executive_state||{},parts=[];if(e.what_needs_attention?.length)parts.push(`**Needs attention**\\n${e.what_needs_attention.slice(0,5).map((x:any)=>`• ${x.title||x.summary}`).join("\\n")}`);if(e.what_changed?.length)parts.push(`**What changed**\\n${e.what_changed.slice(0,5).map((x:any)=>`• ${x.what_happened||x.title||x.summary}`).join("\\n")}`);if(e.actions?.length)parts.push(`**Actions**\\n${e.actions.slice(0,5).map((x:any)=>`• ${x.description||x.title}`).join("\\n")}`);'
          new = 'const canonical=await getCanonicalExecutiveState(sb,binding.organization_id,role==="department_head"?dept:null),state=canonical.executive_state||{},parts=[];if(state.what_needs_attention?.length)parts.push(`**Needs attention**\\n${state.what_needs_attention.slice(0,5).map((x:any)=>`• ${x.title||x.summary}`).join("\\n")}`);if(state.what_changed?.length)parts.push(`**What changed**\\n${state.what_changed.slice(0,5).map((x:any)=>`• ${x.what_happened||x.title||x.summary}`).join("\\n")}`);if(state.actions?.length)parts.push(`**Actions**\\n${state.actions.slice(0,5).map((x:any)=>`• ${x.description||x.title}`).join("\\n")}`);void state.decisions;void state.outcomes;void state.unresolved;void canonical.transitions;'
          if old not in s: raise SystemExit('briefing block needle not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/telegram-gateway/index.ts
          git diff --cached --quiet || git commit -m 'fix: wire Telegram briefing to canonical executive state'
          git push origin HEAD:fix/telegram-executive-director-contract
