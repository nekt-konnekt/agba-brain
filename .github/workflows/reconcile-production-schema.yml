name: Reconcile production schema

on:
  workflow_dispatch:
  push:
    branches:
      - reconcile/prod-source-of-truth

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate database credentials
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ] && [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Missing SUPABASE_DB_URL or SUPABASE_DB_PASSWORD."
            echo "Set one of these repository/environment secrets before running reconciliation."
            exit 1
          fi

      - name: Link production project
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "$SUPABASE_DB_PASSWORD" ]; then
            supabase link --project-ref iijhsdaqaqywzpavdonn --password "$SUPABASE_DB_PASSWORD"
          else
            echo "Using SUPABASE_DB_URL for database operations."
          fi

      - name: Dump current production public schema
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then
            supabase db dump --db-url "$SUPABASE_DB_URL" --schema public -f supabase/production-schema.sql
          else
            supabase db dump --linked --schema public -f supabase/production-schema.sql
          fi

      - name: Compare migration history
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "$SUPABASE_DB_PASSWORD" ]; then
            supabase migration list
          else
            echo "Skipping migration list because only SUPABASE_DB_URL was provided."
          fi

      - name: Generate non-destructive production schema reconciliation
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then
            supabase db diff --db-url "$SUPABASE_DB_URL" --schema public -f production_reconciliation
          else
            supabase db diff --linked --schema public -f production_reconciliation
          fi

      - name: Validate the full migration chain locally
        run: |
          supabase db reset --local --no-seed

      - name: Commit production schema and reconciliation migration
        run: |
          if [ ! -f supabase/production-schema.sql ]; then
            echo "Production schema snapshot was not created."
            exit 1
          fi

          if ! ls supabase/migrations/*_production_reconciliation.sql >/dev/null 2>&1; then
            echo "Production reconciliation migration was not generated."
            exit 1
          fi

          if git status --porcelain -- supabase/production-schema.sql supabase/migrations | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add supabase/production-schema.sql supabase/migrations/*_production_reconciliation.sql
            git commit -m "chore: reconcile production schema [skip ci]"
            git push
          else
            echo "No reconciliation changes detected."
          fi
