name: Patch Superadmin runtime
on:
  push:
    branches: [feat/executive-brief-team-onboarding]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch static Superadmin loader
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('web/superadmin.html')
          s=p.read_text()
          marker='<script src="/superadmin-guard.js"></script>'
          if marker not in s:
              needle='<script src="/superadmin.js"></script>'
              if needle not in s:
                  raise SystemExit('superadmin.js script tag not found')
              s=s.replace(needle, marker+needle, 1)
              p.write_text(s)
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/superadmin.html
          git commit -m 'Load Superadmin guard on static hosting'
          git push