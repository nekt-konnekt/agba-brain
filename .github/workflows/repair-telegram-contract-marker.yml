name: repair telegram contract marker

on:
  push:
    branches:
      - fix/telegram-contract-marker-final

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/telegram-contract-marker-final
      - name: Add required contract marker
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/telegram-gateway/index.ts')
          s = p.read_text()
          marker = 'reasoning_path: "executive_director_contract"'
          if marker not in s:
              needle = 'const executiveDirectorContract=`CONVERSATIONAL EXECUTIVE DIRECTOR CONTRACT'
              if needle not in s:
                  raise SystemExit('executive director contract not found')
              s = s.replace(needle, needle + '\\n\\nStructured reasoning path: ' + marker, 1)
              p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/telegram-gateway/index.ts
          git diff --cached --quiet || git commit -m 'fix: add Telegram executive director reasoning path marker'
          git push origin HEAD:fix/telegram-contract-marker-final
