name: Fix Ask Agba transport
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ask-agba-transport.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Fix Ask Agba direct Edge Function transport'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Ask Agba
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('web/app.js')
          s=p.read_text()
          old="""async function askAgba(q){const s=await refreshSession();if(!s||!organizationId)throw Error('Sign in required');let result=await supabaseClient.functions.invoke('ceo-query',{body:{organization_id:organizationId,question:q},headers:authHeaders()});if(result.error&&(result.error.status===401||result.error.status===403)){const refreshed=await supabaseClient.auth.refreshSession();session=refreshed.data?.session||null;if(session)result=await supabaseClient.functions.invoke('ceo-query',{body:{organization_id:organizationId,question:q},headers:authHeaders()})}const{data,error}=result;if(error)throw error;if(data?.error)throw Error(data.detail||data.error);return data?.answer?data:data}"""
          new="""async function askAgba(q){const s=await refreshSession();if(!s||!organizationId)throw Error('Sign in required');const token=s.access_token;if(!config.url||!config.anon)throw Error('Configuration missing');const call=async()=>{const response=await fetch(`${config.url.replace(/\\\\\\/+$/,'')}/functions/v1/ceo-query`,{method:'POST',headers:{'Content-Type':'application/json',apikey:config.anon,Authorization:`Bearer ${token}`},body:JSON.stringify({organization_id:organizationId,question:q})});let payload=null;try{payload=await response.json()}catch{}if(!response.ok){const detail=payload?.detail?.message||payload?.detail||payload?.error||`Edge Function request failed (${response.status})`;const err=new Error(String(detail));err.status=response.status;err.payload=payload;throw err}if(payload?.error)throw Error(payload.detail?.message||payload.detail||payload.error);return payload};try{return await call()}catch(e){if(e?.status===401||e?.status===403){const refreshed=await supabaseClient.auth.refreshSession();session=refreshed.data?.session||null;if(session?.access_token){const response=await fetch(`${config.url.replace(/\\\\\\/+$/,'')}/functions/v1/ceo-query`,{method:'POST',headers:{'Content-Type':'application/json',apikey:config.anon,Authorization:`Bearer ${session.access_token}`},body:JSON.stringify({organization_id:organizationId,question:q})});let payload=null;try{payload=await response.json()}catch{}if(!response.ok)throw Error(payload?.detail?.message||payload?.detail||payload?.error||`Edge Function request failed (${response.status})`);if(payload?.error)throw Error(payload.detail?.message||payload.detail||payload.error);return payload}}throw e}}"""
          if old not in s:
              raise SystemExit('Ask Agba function pattern not found; aborting')
          p.write_text(s.replace(old,new))
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/fix-ask-agba-transport.yml
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/app.js .github/workflows/fix-ask-agba-transport.yml
          git commit -m 'Fix Ask Agba direct Edge Function transport'
          git push
