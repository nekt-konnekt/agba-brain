name: Patch Telegram worker auth

on:
  push:
    branches:
      - feat/executive-brief-team-onboarding

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch gateway worker authentication
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/telegram-gateway/index.ts')
          s = p.read_text()
          old = '''  const secret = Deno.env.get("TELEGRAM_WEBHOOK_SECRET");
  if (secret && req.headers.get("x-telegram-bot-api-secret-token") !== secret) return json({ error: "forbidden" }, 403);'''
          new = '''  const workerHeader = req.headers.get("x-agba-worker-secret");
  const webhookHeader = req.headers.get("x-telegram-bot-api-secret-token");
  let authorized = false;
  if (workerHeader) {
    const { data } = await supabase.rpc("agba_telegram_worker_secret");
    authorized = !!data && String(data) === workerHeader;
  } else {
    const expected = Deno.env.get("TELEGRAM_WEBHOOK_SECRET");
    authorized = !expected || webhookHeader === expected;
  }
  if (!authorized) return json({ error: "forbidden" }, 403);'''
          if old not in s:
              raise SystemExit('gateway auth pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git config user.name "agba-bot"
          git config user.email "agba-bot@users.noreply.github.com"
          git add supabase/functions/telegram-gateway/index.ts .github/workflows/patch-telegram-worker-auth.yml
          git commit -m "Preserve Telegram worker gateway authentication"
          git rm .github/workflows/patch-telegram-worker-auth.yml
          git commit -m "Remove temporary Telegram worker auth patch workflow"
          git push
