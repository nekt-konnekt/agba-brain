name: Landing readability pass
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: "!contains(github.event.head_commit.message, 'Apply landing readability pass')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve landing page readability
        shell: python
        run: |
          from pathlib import Path
          p = Path('web/index.html')
          s = p.read_text()
          marker = '</style>'
          css = '''
/* Agba landing readability pass — preserves the existing agba. wordmark and acid-lime dot. */
:root{--text-readable:#f4f4ee;--text-secondary:#b2b2aa;--text-tertiary:#8d8d87}
.nav{height:82px}.logo{font-size:27px}.navlinks{gap:30px;font-size:14px}.navcta,.btn.primary{font-size:14px;padding:13px 19px}.btn{font-size:14px;padding:14px 21px}.eyebrow{font-size:11px;letter-spacing:.17em}.hero{padding:96px 0 105px}.hero h1{font-size:clamp(52px,7vw,92px);line-height:.98}.hero p{font-size:19px;color:var(--text-secondary);line-height:1.7}.proof{font-size:10px}.signal{padding:19px}.signal small{font-size:10px}.signal strong{font-size:14px}.agba-core b{font-size:30px}.agba-core .brain{font-size:40px}.agba-core small{font-size:9px}.ceo{font-size:21px}.risk{font-size:10px}.section{padding:112px 0}.section h2{font-size:clamp(40px,5vw,66px)}.section>p{font-size:17px;color:var(--text-secondary);line-height:1.75}.dept{padding:24px 16px}.dept b{font-size:15px}.dept span{font-size:12px}.evidence{padding:27px}.evidence .item{font-size:14px;color:#b5b5ae;line-height:1.6}.evidence .item b{font-size:10px}.connect .core{font-size:29px}.connect h3{font-size:25px}.connect p{font-size:14px}.riskbox{font-size:11px}.step{font-size:12px}.telegram-section{padding-top:78px}.telegram-copy p{font-size:17px}.tg-title{font-size:13px}.tg-title small{font-size:10px}.chat-tab{font-size:10px}.message{font-size:12px;line-height:1.6}.message .meta{font-size:9px}.tg-input span{font-size:11px}.chat-note{font-size:10px}.chat-feature{padding:16px}.chat-feature b{font-size:11px}.chat-feature span{font-size:11px;line-height:1.55}.stage{padding:30px}.stage b{font-size:30px}.stage p{font-size:14px;line-height:1.65}.ideal{font-size:12px}.final{padding:88px 30px}.final h2{font-size:clamp(42px,5vw,68px)}.final p{font-size:17px}.footer{font-size:11px}
@media(max-width:680px){.nav{height:70px}.logo{font-size:26px}.navcta{font-size:13px;padding:11px 14px}.hero{padding-top:68px}.hero h1{font-size:clamp(44px,13vw,68px);line-height:1}.hero p{font-size:17px}.eyebrow{font-size:10px}.section{padding:88px 0}.section h2{font-size:clamp(38px,11vw,54px)}.section>p{font-size:16px}.signal{padding:15px}.signal small{font-size:9px}.signal strong{font-size:13px}.dept b{font-size:14px}.dept span{font-size:11px}.evidence .item{font-size:13px}.connect h3{font-size:22px}.connect p{font-size:13px}.telegram-copy p{font-size:16px}.message{font-size:11px}.chat-feature span{font-size:10px}.stage p{font-size:13px}.final{padding:68px 22px}.final p{font-size:16px}}
'''
          if 'Agba landing readability pass' not in s:
              s = s.replace(marker, css + marker, 1)
              p.write_text(s)
      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/landing-readability.yml
          git add web/index.html .github/workflows/landing-readability.yml
          git commit -m "Apply landing readability pass"
          git push
