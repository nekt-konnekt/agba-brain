name: One-time Telegram staff binding patch

on:
  push:
    branches:
      - feat/executive-brief-team-onboarding

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix: bind staff Telegram invitations') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/executive-brief-team-onboarding
          fetch-depth: 0

      - name: Patch non-CEO invitation binding
        shell: python
        run: |
          from pathlib import Path
          p = Path('supabase/functions/telegram-gateway/index.ts')
          s = p.read_text()
          old = '''const { data: invite } = await supabase.from("agba_telegram_invitations").select("id,organization_id,role_code,expires_at,used_at,created_by,agba_organizations(name)").eq("token_hash", tokenHash).maybeSingle();'''
          new = '''const { data: invite } = await supabase.from("agba_telegram_invitations").select("id,organization_id,role_code,expires_at,used_at,created_by,target_agba_user_id,agba_organizations(name)").eq("token_hash", tokenHash).maybeSingle();'''
          if old not in s:
              raise SystemExit('target select statement not found')
          s = s.replace(old, new, 1)
          old_block = '''    await send(chatId, `This invitation is for a ${invite.role_code === "department_head" ? "department head" : "company owner"}. The account connection step is not available for a new person yet. Ask the company owner to finish setting up your Agba user first.`); return json({ ok: true });'''
          new_block = '''    if (invite.role_code === "department_head" || invite.role_code === "employee") {
      if (!invite.target_agba_user_id) {
        await send(chatId, "This invitation is missing its staff account. Ask your company owner to generate a new invitation.");
        return json({ ok: true });
      }
      const { data: staff } = await supabase.from("agba_users").select("id,organization_id,department_id").eq("id", invite.target_agba_user_id).eq("organization_id", invite.organization_id).maybeSingle();
      if (!staff) {
        await send(chatId, "I couldn't verify this staff account. Ask your company owner to generate a new invitation.");
        return json({ ok: true });
      }
      const { data: existingBinding } = await supabase.from("agba_telegram_bindings").select("chat_id,agba_user_id").eq("chat_id", chatId).maybeSingle();
      if (existingBinding && existingBinding.agba_user_id !== staff.id) {
        await send(chatId, "This Telegram account is already connected to another Agba user. Please use the correct Telegram account for this invitation.");
        return json({ ok: true });
      }
      if (!existingBinding) {
        const { error: bindError } = await supabase.from("agba_telegram_bindings").insert({
          organization_id: staff.organization_id,
          agba_user_id: staff.id,
          role_code: invite.role_code,
          chat_id: chatId,
          telegram_user_id: msg.from?.id ? String(msg.from.id) : null,
          telegram_username: msg.from?.username || null
        });
        if (bindError) {
          console.error("telegram_staff_connect_failed", bindError);
          await send(chatId, "I couldn't complete the Telegram connection right now. Please try the connection again.");
          return json({ ok: true });
        }
      }
      await supabase.from("agba_telegram_invitations").update({ used_at: new Date().toISOString() }).eq("id", invite.id);
      const roleLabel = invite.role_code === "department_head" ? "Department Head" : "Employee";
      await send(chatId, `Agba 🧠\\n\\nTelegram is now connected to your Agba account as ${roleLabel}. You can report to Agba here.`);
      return json({ ok: true });
    }
    await send(chatId, `This invitation is for a ${invite.role_code === "department_head" ? "department head" : "company owner"}. The account connection step is not available for this invitation.`); return json({ ok: true });'''
          if old_block not in s:
              raise SystemExit('target refusal block not found')
          s = s.replace(old_block, new_block, 1)
          p.write_text(s)

      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-telegram-staff-binding.yml
          git add supabase/functions/telegram-gateway/index.ts
          git commit -m "fix: bind staff Telegram invitations"
          git push origin feat/executive-brief-team-onboarding
