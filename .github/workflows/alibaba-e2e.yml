name: Agba Alibaba Integration E2E

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

jobs:
  alibaba-e2e:
    environment: Agba
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run Alibaba-backed Agba E2E suite
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_BASE_URL: ${{ secrets.DASHSCOPE_BASE_URL }}
          DASHSCOPE_MODEL: ${{ secrets.DASHSCOPE_MODEL }}
        run: |
          deno run --allow-net --allow-env tests/agba-puter-e2e.ts
          deno run --allow-net --allow-env tests/agba-memory-e2e.ts
          deno run --allow-net --allow-env tests/agba-ceo-query-reliability-e2e.ts
          deno run --allow-net --allow-env tests/agba-action-memory-e2e.ts
